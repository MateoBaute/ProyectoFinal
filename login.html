<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./root.css">
    <link rel="stylesheet" href="./css/login.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">

    <title>Inicio de Sesión</title>

</head>

<body>

    <div class="login">

        <h2 class="titulologin">Inicio de Sesión</h2>

           <p class="parrafologin">Correo Electrónico</p>
        <input type="email" name="mail" id="Email" placeholder="ejemplo@correo.com" required>
        
      
        <p class="parrafologin">Contraseña</p>
        <input type="password" name="Password" id="Password" placeholder="Ingrese su contraseña" required> 

        <button class="botonlogin" onclick="login()">Iniciar</button>

        <button class="botonback" onclick="location.href='./index.html'">Volver</button>

        <p class="registerlink"> ¿No tienes cuenta?</p>
        <a class="a" href="register.html">¡Regístrate haciendo clic aquí!</a>

    </div>
   
</body>
<script src="./js/LoginScripts.js" defer></script>
</html>
